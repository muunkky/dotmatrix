changelog:
  - version: 0.1.0
    date: '2025-10-31'
    changes:
      - Initial roadmap created for DotMatrix circle detection CLI
      - 'Defined V1 with three milestones: MVP, Enhancement, Production'
  - version: 0.2.1
    date: '2025-11-29'
    changes:
      - 'CELLCLUSTER Sprint: Confirmed cell-based clustering already implemented via
        --reconstitute'
      - 'Discovery: cluster_pixel_counter.py uses KDTree nearest-neighbor (Voronoi
        tessellation)'
      - 'Discovery: --reconstitute bypasses circle detection and uses cluster_and_count_pixels()
        directly'
      - CMYK accuracy measurement module (cmyk_accuracy.py) created and 
        validated
      - Accuracy comparison found 24.6% error due to flower renderer 
        blend-overlaps issue
      - Created follow-up bug card (01gzl3) for C+M overlap improvement
  - version: 0.2.0
    date: '2025-12-01'
    changes:
      - Fixed missing small halftone clusters by switching cluster detection 
        threshold to absolute `0.5` (reduced orphan pixels to 0).
      - 'Improved cluster counting: detected +190 clusters (15,794 total) vs prior
        15,604.'
      - Added orphan diagnostic tooling and scripts to analyze detection 
        quality.
      - Release tagged `v0.2.0`.
      - Updated tests and verification for small-dot detection.
  - version: 0.2.1
    date: '2025-12-03'
    changes:
      - Added V2 to roadmap for Artistic Rendering (Jitter, ASCII, SVG)
  - version: unreleased
    date: '2025-12-06'
    changes:
      - Enhanced black dot verification with radius suggestion algorithm (card 
        ajwv8f)
      - Added visual coverage heatmap for detection density analysis
      - Implemented suggest_radius_range() using mean ± 2σ statistical analysis
      - Coverage maps saved automatically in debug mode
  - changes:
      - Created ADR-006 documenting CMYK cluster pixel counting architecture 
        (card krzyj6)
      - 'Documented 3-phase algorithm: midtone completion, nearest-pixel clustering,
        and deduplication'
      - Prevents double-counting by subtracting RGB overlaps from CMY totals
    date: '2025-12-06'
    version: unreleased
  - version: unreleased
    date: '2025-12-06'
    changes:
      - 'Updated roadmap: marked progress-reporting project as done (M3>large-file-support)'
      - Synced roadmap with actual implementation status for completed features
  - changes:
      - Verified organized-output-dirs feature already implemented (--run-name, 
        --no-organize flags)
      - 'Updated roadmap: marked organized-output-dirs as done (M3>workflow-improvements)'
      - Created comprehensive test suite for run directory management 
        (test_run_directory_management.py)
      - Closed verification card 418dhb documenting existing implementation
    date: '2025-12-06'
    version: unreleased
  - version: work-session-2024-12-06
    changes:
      - Verified organized-output-directories feature already implemented in 
        run_manager.py
      - Created comprehensive TDD test suite (test_run_directory_management.py)
      - 'Updated roadmap: progress-reporting project marked done'
      - Closed feature card 418dhb (organized-output-dirs verification)
      - Closed planning spike jpr3r1 (post-release cleanup planning)
    date: '2024-12-06'
  - version: unreleased
    date: '2025-12-17'
    changes:
      - 'Triage spike pn661q: Systematically reviewed gitban board and roadmap status'
      - Identified 5 completed M3 cards ready for archival (6b4iz6, 418dhb, 
        ajwv8f, krzyj6, jpr3r1)
      - 'Updated roadmap: marked organized-output-dirs and progress-reporting projects
        as done'
      - Downgraded cju1m7 CMYK bug from P0 to P1 (optional blend_overlaps flag, 
        workarounds exist)
      - Resolved status inconsistency in card 6b4iz6 (appears in both done and 
        todo)
      - Recommended weekly Friday triage sessions to prevent done card backlog
  - version: 2.0.0-alpha
    date: '2026-01-05'
    changes:
      - 'Research phase complete: Jitter, ASCII, SVG, and partial circle detection'
      - 4 research spikes completed with 43.5KB of comprehensive documentation
      - 'Jitter: Gaussian algorithm recommended with CLI flags designed'
      - 'ASCII: Character-per-circle rendering with Unicode/ASCII character sets'
      - 'SVG: Color-grouped structure with optimization techniques'
      - 'Partial circles: Arc fitting approach with confidence scoring'
      - Roadmap updated with V2 milestone and project tracking
versions:
  v1:
    id: v1
    title: 'V1: DotMatrix Circle Detection CLI'
    description: First production-ready version of DotMatrix - a Python CLI tool
      that detects circles in images with overlapping and occlusion support
    status: todo
    start_date: '2025-10-31'
    target_completion: '2025-11-30'
    milestones:
      m1:
        id: m1
        title: 'M1: MVP - Basic Circle Detection'
        description: Implement core functionality to detect non-overlapping 
          circles in images and output their properties
        status: done
        due_date: '2025-11-07'
        success_criteria:
          - CLI successfully reads image files (PNG, JPG)
          - Detects circles using Hough Circle Transform
          - Outputs center coordinates, radius, and average color for each 
            circle
          - Works on test images with non-overlapping circles
          - Unit tests cover core detection logic
        features:
          cli-foundation:
            id: cli-foundation
            title: CLI Foundation & Project Setup
            description: Set up Python project structure, CLI interface, and 
              basic file I/O
            priority: critical
            status: todo
            depends_on: []
            projects:
              project-setup:
                id: project-setup
                title: Initialize Python Project Structure
                description: Create Python package with proper structure, 
                  pyproject.toml, dependencies (click, opencv-python, numpy, 
                  pillow)
                owner: ''
                tdd_spec: pip install -e . runs successfully, dotmatrix --help 
                  displays usage
                docs_ref: README.md
                sequence: 1
                depends_on: []
                status: todo
              cli-interface:
                id: cli-interface
                title: Implement CLI Interface with Click
                description: 'Create CLI with arguments: --input (image path), --output
                  (optional JSON/CSV), --debug flag'
                owner: ''
                tdd_spec: dotmatrix --input test.png runs without error, 
                  dotmatrix validates file exists
                docs_ref: docs/cli-usage.md
                sequence: 2
                depends_on:
                  - project-setup
                status: todo
              image-loader:
                id: image-loader
                title: Image Loading and Validation
                description: Load images using OpenCV/Pillow, validate format 
                  and dimensions
                owner: ''
                tdd_spec: Successfully loads PNG/JPG files, rejects invalid 
                  formats with clear error
                docs_ref: TBD
                sequence: 3
                depends_on:
                  - cli-interface
                status: todo
          circle-detection:
            id: circle-detection
            title: Basic Circle Detection Algorithm
            description: Implement Hough Circle Transform for detecting 
              non-overlapping circles
            priority: critical
            status: todo
            depends_on:
              - cli-foundation
            projects:
              hough-transform:
                id: hough-transform
                title: Implement Hough Circle Transform
                description: Use cv2.HoughCircles to detect circles in grayscale
                  images
                owner: ''
                tdd_spec: Detects at least 90% of circles in test images with 
                  <5px center error
                docs_ref: docs/algorithms/hough-transform.md
                sequence: 1
                depends_on: []
                status: todo
              color-extraction:
                id: color-extraction
                title: Extract Circle Colors
                description: Sample pixels within detected circles to determine 
                  average RGB color
                owner: ''
                tdd_spec: Returns RGB tuple within 10% tolerance of actual 
                  circle color
                docs_ref: TBD
                sequence: 2
                depends_on:
                  - hough-transform
                status: todo
              result-formatter:
                id: result-formatter
                title: Format Detection Results
                description: Structure output as JSON/CSV with center (x,y), 
                  radius, color (r,g,b)
                owner: ''
                tdd_spec: 'Outputs valid JSON with schema: [{center: [x,y], radius:
                  r, color: [r,g,b]}]'
                docs_ref: docs/output-format.md
                sequence: 3
                depends_on:
                  - color-extraction
                status: todo
          testing-mvp:
            id: testing-mvp
            title: MVP Testing & Validation
            description: Create test suite and validation images for MVP 
              functionality
            priority: high
            status: todo
            depends_on:
              - circle-detection
            projects:
              test-images:
                id: test-images
                title: Generate Test Image Dataset
                description: Create synthetic test images with known circle 
                  properties
                owner: ''
                tdd_spec: 10+ test images with documented ground truth (center, 
                  radius, color)
                docs_ref: tests/data/README.md
                sequence: 1
                depends_on: []
                status: todo
              unit-tests:
                id: unit-tests
                title: Write Unit Tests
                description: 'Test each module: image loading, circle detection, color
                  extraction, formatting'
                owner: ''
                tdd_spec: pytest runs with >80% code coverage, all tests pass
                docs_ref: TBD
                sequence: 2
                depends_on:
                  - test-images
                status: todo
      m2:
        id: m2
        title: 'M2: Overlapping Circle Detection'
        description: Enhance detection to handle overlapping and occluded 
          circles
        status: todo
        due_date: '2025-11-17'
        success_criteria:
          - Detects partially occluded circles (>50% visible)
          - Separates overlapping circles correctly
          - Color extraction samples only visible pixels
          - 'Performance: <2s for 1920x1080 image with 20 circles'
        features:
          advanced-detection:
            id: advanced-detection
            title: Advanced Detection for Overlapping Circles
            description: Implement algorithms to detect and separate overlapping
              circles
            priority: critical
            status: todo
            depends_on: []
            projects:
              edge-detection:
                id: edge-detection
                title: Improve Edge Detection
                description: Enhanced edge detection using Canny algorithm with 
                  L2 gradient and adaptive thresholding. Reduces false positive 
                  rate from 22% to 8.5% on overlapping circle test dataset. 
                  Integrated with CLI via --edge-detection, --canny-low, 
                  --canny-high, and --adaptive-threshold flags.
                status: done
                sequence: 1
                owner: CAMERON
                tdd_spec: tests/test_edge_detector.py (11 tests, 83% coverage)
                docs_ref: docs/adr/ADR-008-edge-detection-algorithm.md
              multi-scale-detection:
                id: multi-scale-detection
                title: Multi-Scale Circle Detection
                description: Run Hough transform at multiple scales to catch 
                  circles of varying sizes
                owner: ''
                tdd_spec: Detects circles from 10px to 500px radius with >85% 
                  accuracy
                docs_ref: TBD
                sequence: 2
                depends_on:
                  - edge-detection
                status: todo
              occlusion-handling:
                id: occlusion-handling
                title: Handle Occluded Circles
                description: Detect partially visible circles and estimate full 
                  circle from visible arc
                owner: ''
                tdd_spec: Detects circles with >50% visibility, estimates center
                  within 10px error
                docs_ref: docs/algorithms/occlusion.md
                sequence: 3
                depends_on:
                  - multi-scale-detection
                status: todo
          color-refinement:
            id: color-refinement
            title: Refined Color Extraction for Overlaps
            description: Improve color sampling to handle overlapping circles 
              correctly
            priority: high
            status: todo
            depends_on:
              - advanced-detection
            projects:
              depth-ordering:
                id: depth-ordering
                title: Infer Circle Depth Ordering
                description: Determine which circles are in front based on 
                  occlusion patterns
                owner: ''
                tdd_spec: Correctly orders 80% of overlapping pairs in test 
                  images
                docs_ref: docs/algorithms/depth-ordering.md
                sequence: 1
                depends_on: []
                status: todo
              masked-sampling:
                id: masked-sampling
                title: Sample Colors with Occlusion Masks
                description: Create masks to sample only visible pixels of each 
                  circle
                owner: ''
                tdd_spec: Color extraction within 15% tolerance for overlapping 
                  circles
                docs_ref: TBD
                sequence: 2
                depends_on:
                  - depth-ordering
                status: todo
          performance-opt:
            id: performance-opt
            title: Performance Optimization
            description: Optimize detection speed for larger images
            priority: high
            status: todo
            depends_on: []
            projects:
              algorithm-tuning:
                id: algorithm-tuning
                title: Tune Algorithm Parameters
                description: Optimize Hough transform parameters for 
                  speed/accuracy tradeoff
                owner: ''
                tdd_spec: 1920x1080 image with 20 circles processes in <2 
                  seconds
                docs_ref: TBD
                sequence: 1
                depends_on: []
                status: todo
              parallel-processing:
                id: parallel-processing
                title: Add Parallel Processing Support
                description: Use multiprocessing for batch image processing
                owner: ''
                tdd_spec: Batch processing 10 images uses multiple cores, 2x 
                  speedup
                docs_ref: TBD
                sequence: 2
                depends_on:
                  - algorithm-tuning
                status: todo
      m3:
        id: m3
        title: 'M3: Production Ready & Polish'
        description: Add production features, documentation, and distribution 
          packaging
        status: todo
        due_date: '2025-11-30'
        success_criteria:
          - Comprehensive documentation and examples
          - Installable via pip
          - Confidence scores for each detection
          - Visualization mode shows detected circles
          - CI/CD pipeline running tests
        features:
          output-enhancements:
            id: output-enhancements
            title: Enhanced Output & Visualization
            description: Add confidence scores, visualization mode, and flexible
              output formats
            priority: high
            status: todo
            depends_on: []
            projects:
              confidence-scores:
                id: confidence-scores
                title: Add Detection Confidence Scores
                description: Calculate confidence score (0-1) for each detected 
                  circle
                owner: ''
                tdd_spec: Output includes confidence field, higher for clearly 
                  visible circles
                docs_ref: docs/output-format.md
                sequence: 1
                depends_on: []
                status: todo
              visualization:
                id: visualization
                title: Implement Visualization Mode
                description: Add --visualize flag to output image with detected 
                  circles overlaid
                owner: ''
                tdd_spec: dotmatrix --visualize saves output image with circles 
                  drawn
                docs_ref: docs/cli-usage.md
                sequence: 2
                depends_on: []
                status: todo
              output-formats:
                id: output-formats
                title: Support Multiple Output Formats
                description: Support JSON, CSV, and plain text output formats
                owner: ''
                tdd_spec: dotmatrix --format json|csv|txt produces valid output
                docs_ref: docs/output-format.md
                sequence: 3
                depends_on:
                  - confidence-scores
                status: todo
          documentation:
            id: documentation
            title: Comprehensive Documentation
            description: Write user guide, API docs, algorithm explanations, and
              examples
            priority: high
            status: todo
            depends_on: []
            projects:
              user-guide:
                id: user-guide
                title: Write User Guide
                description: Complete user guide with installation, usage, 
                  examples, troubleshooting
                owner: ''
                tdd_spec: docs/user-guide.md covers all CLI flags with examples
                docs_ref: docs/user-guide.md
                sequence: 1
                depends_on: []
                status: todo
              algorithm-docs:
                id: algorithm-docs
                title: Document Detection Algorithms
                description: Explain Hough transform, occlusion handling, color 
                  extraction algorithms
                owner: ''
                tdd_spec: docs/algorithms/ contains detailed explanations with 
                  diagrams
                docs_ref: docs/algorithms/README.md
                sequence: 2
                depends_on: []
                status: todo
              api-reference:
                id: api-reference
                title: Generate API Reference
                description: Use sphinx/mkdocs to generate API docs from 
                  docstrings
                owner: ''
                tdd_spec: API docs published at docs.dotmatrix.io or in 
                  docs/api/
                docs_ref: docs/api/README.md
                sequence: 3
                depends_on: []
                status: todo
          distribution:
            id: distribution
            title: Package & Distribution
            description: Prepare for PyPI distribution and set up CI/CD
            priority: high
            status: todo
            depends_on: []
            projects:
              pypi-packaging:
                id: pypi-packaging
                title: Prepare PyPI Package
                description: Configure pyproject.toml for PyPI, add classifiers,
                  README for PyPI
                owner: ''
                tdd_spec: python -m build creates wheel, twine check passes
                docs_ref: docs/development/packaging.md
                sequence: 1
                depends_on: []
                status: todo
              ci-cd:
                id: ci-cd
                title: Set Up CI/CD Pipeline
                description: GitHub Actions for testing, linting, and automated 
                  releases
                owner: ''
                tdd_spec: CI runs tests on push, creates release on tag
                docs_ref: .github/workflows/README.md
                sequence: 2
                depends_on: []
                status: todo
              publish-pypi:
                id: publish-pypi
                title: Publish to PyPI
                description: Upload package to PyPI, verify pip install 
                  dotmatrix works
                owner: ''
                tdd_spec: pip install dotmatrix installs latest version from 
                  PyPI
                docs_ref: TBD
                sequence: 3
                depends_on:
                  - pypi-packaging
                  - ci-cd
                status: todo
          polish:
            id: polish
            title: Final Polish & Error Handling
            description: Improve error messages, add logging, handle edge cases
            priority: high
            status: todo
            depends_on: []
            projects:
              error-handling:
                id: error-handling
                title: Comprehensive Error Handling
                description: Add clear error messages for invalid inputs, 
                  missing files, unsupported formats
                owner: ''
                tdd_spec: All error conditions produce helpful messages, 
                  non-zero exit codes
                docs_ref: TBD
                sequence: 1
                depends_on: []
                status: todo
              logging:
                id: logging
                title: Add Logging Support
                description: Implement --verbose flag with detailed logging for 
                  debugging
                owner: ''
                tdd_spec: dotmatrix --verbose logs detection steps and timings
                docs_ref: TBD
                sequence: 2
                depends_on: []
                status: todo
              edge-cases:
                id: edge-cases
                title: Handle Edge Cases
                description: 'Test and handle: no circles found, very small/large
                  images, malformed images'
                owner: ''
                tdd_spec: Gracefully handles edge cases documented in 
                  tests/edge-cases/
                docs_ref: tests/edge-cases/README.md
                sequence: 3
                depends_on:
                  - error-handling
                  - logging
                status: todo
          workflow-improvements:
            id: workflow-improvements
            title: Workflow Improvements
            description: Better output organization, config files, and run 
              management for users running many experiments
            status: in_progress
            priority: high
            projects:
              organized-output-dirs:
                id: organized-output-dirs
                title: Organized Output Directories with Run Naming
                description: Auto-create timestamped/named output folders for 
                  each run
                status: done
                sequence: 1
                completion_notes: Feature already implemented with --run-name 
                  flag and --no-organize for backward compatibility. Uses 
                  run_manager module with create_run_directory() and manifest 
                  generation. Card 418dhb verified and archived to 
                  2025-Q4-M3-completion collection.
              config-save-load:
                id: config-save-load
                title: Save and Load Config Files
                description: Save detection settings to YAML/JSON config files 
                  that can be reloaded
                status: todo
                sequence: 2
              run-manifest:
                id: run-manifest
                title: Run Manifest with Metadata
                description: Auto-generate manifest.json with settings, source 
                  file, timestamp for each run
                status: todo
                sequence: 3
              search-past-runs:
                id: search-past-runs
                title: List and Search Past Runs
                description: CLI commands to list, search, and compare past 
                  detection runs
                status: todo
                sequence: 4
          large-file-support:
            id: large-file-support
            title: Large File Support (10MB+)
            status: in_progress
            priority: high
            description: Support for processing large image files up to 10MB+ 
              (4-9 megapixels). Based on spike research (ADR-001), no special 
              processing is needed - current architecture handles target sizes 
              efficiently.
            depends_on: []
            projects:
              perf-benchmark:
                id: perf-benchmark
                title: Performance Benchmarking
                status: done
                sequence: 1
                description: Establish baseline performance metrics across image
                  sizes. Completed spike w804xa.
                owner: ''
                tdd_spec: Benchmark scripts in benchmarks/
                docs_ref: docs/adr/ADR-001-large-file-processing.md
                depends_on: []
              size-warnings:
                id: size-warnings
                title: Add Size Warnings for Large Images
                status: todo
                sequence: 2
                description: Add warnings for convex detection on images >20MP.
                owner: ''
                tdd_spec: Warning displayed when image exceeds 20MP with 
                  --convex-edge
                docs_ref: ''
                depends_on:
                  - perf-benchmark
              progress-reporting:
                id: progress-reporting
                title: Progress Reporting for Long Operations
                description: Real-time progress feedback during rendering with 
                  throughput, ETA, and GPU/CPU status indicators
                status: done
                sequence: 3
                completion_notes: Implemented comprehensive progress callback 
                  system with metadata propagation. Displays clusters/sec 
                  throughput, ETA calculation, and GPU/CPU render mode. 
                  Integrated into CLI with user-friendly formatting. Card 6b4iz6
                  verified and archived to 2025-Q4-M3-completion collection.
          cmyk-accuracy-optimization:
            id: cmyk-accuracy-optimization
            title: CMYK Accuracy Optimization
            description: Advanced techniques for improving CMYK pixel count 
              accuracy in flower petal rendering
            status: in_progress
            priority: high
            projects:
              petal-distance-tuning:
                id: petal-distance-tuning
                title: Petal Distance Tuning
                status: done
                sequence: 1
                description: Optimized default petal_distance from 0.5 to 0.35, 
                  reducing CMYK error by 33%. Added --petal-distance CLI option.
              petal-angle-optimization:
                id: petal-angle-optimization
                title: 90 Degree Petal Angle Optimization
                status: done
                sequence: 2
                description: Changed petal angles from 120 apart to 90 apart 
                  (N/E/S) to reduce overlap with neighboring black circles.
              global-black-mask:
                id: global-black-mask
                title: Global Black Mask Optimization
                status: done
                sequence: 3
                description: Build global black mask first, then optimize petal 
                  radii against all neighboring blacks.
              per-cluster-optimization:
                id: per-cluster-optimization
                title: Per-Cluster Multivariate Optimization
                status: todo
                sequence: 4
                description: 'Future: Optimize petal_distance, angle, radius per-cluster
                  based on local density and color composition. Fixed 0.35 works for
                  2-3 tones but per-cluster tuning could further improve accuracy.'
              small-cluster-detection:
                id: small-cluster-detection
                title: Small Cluster Detection (SMALLDOTS Sprint)
                status: done
                sequence: 5
                description: Multi-pass detection algorithm to capture small 
                  halftone clusters missed by standard detection. Reduces orphan
                  pixels from ~38k to <1k for $50k+ print quality.
                owner: CAMERON
                tdd_spec: tests/test_multipass_detection.py
                docs_ref: docs/architecture/multipass-detection.md
                completion_notes: 'Fixed in v0.2.0 (f4772fe). Changed threshold from
                  ratio-based to absolute (0.5) to detect all dot sizes (1px+). Before:
                  15604 clusters, 64 missed dots, 4335 orphan pixels. After: 15794
                  clusters, 0 missed dots, 0 orphan pixels. SMALLDOTS sprint completed
                  with 69 cards archived.'
      m4:
        id: m4
        title: 'M4: GPU Acceleration'
        status: todo
        due_date: '2025-12-15'
        description: 'GPU-accelerated rendering for large images. Target: <2 minute
          render time for 38.9MP images.'
        success_criteria:
          - GPU rendering produces output matching CPU baseline
          - Large image render time < 2 minutes (from 73+ minutes)
          - --gpu CLI flag with auto-detection and fallback
          - Comprehensive equivalence and benchmark tests
        features:
          gpu-environment:
            id: gpu-environment
            title: GPU Environment Setup
            status: todo
            priority: critical
            description: Research and install GPU framework (CuPy, Numba, or 
              alternative)
            projects:
              gpu-framework-spike:
                id: gpu-framework-spike
                title: GPU Framework Selection Spike
                status: done
                owner: CAMERON
                sequence: 1
                description: 'Research and select GPU framework. Decision: CuPy. Card:
                  79itcc'
              gpu-install-config:
                id: gpu-install-config
                title: Install and Configure GPU Environment
                status: todo
                owner: CAMERON
                sequence: 2
                description: 'Install CUDA toolkit, chosen framework, verify environment.
                  Card: dmzrn4'
              cpu-baseline-verify:
                id: cpu-baseline-verify
                title: Verify CPU Baseline
                status: todo
                owner: CAMERON
                sequence: 3
                description: 'Establish baseline metrics and verify CPU rendering
                  correctness. Card: o9yarx'
          gpu-implementation:
            id: gpu-implementation
            title: GPU Renderer Implementation
            status: todo
            priority: critical
            description: Implement GPU-accelerated flower renderer
            projects:
              gpu-algorithm-spike:
                id: gpu-algorithm-spike
                title: GPU Algorithm Design Spike
                status: done
                owner: CAMERON
                sequence: 1
                description: 'Design GPU-parallelizable algorithm. Decision: CuPy
                  batch implementation. Card: qt2qer'
              gpu-flower-renderer:
                id: gpu-flower-renderer
                title: Implement GPU Flower Renderer
                status: todo
                owner: CAMERON
                sequence: 2
